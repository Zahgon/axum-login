[package]
name = "example-sqlite"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
actix-login = { path = "../../actix-login" }
actix-session = "0.11.0"
actix-web = "4.15.0"
actix-web-flash-messages = { version = "0.5.0", default-features = false }
anyhow = "1.0"
askama = { version = "0.14.0" }
password-auth = "1.0.0"
serde = "1"
serde_json = "1"
sqlx = { version = "0.8.1", features = ["sqlite", "time", "runtime-tokio"] }
thiserror = "2.0.0"
tokio = { version = "1.34.0", features = ["full"] }
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
